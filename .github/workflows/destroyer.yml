name: Destroyer

on: workflow_dispatch

concurrency:
  group: destroyer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/cntryl/fitz-destroyer@${{ steps.build.outputs.digest }}
    steps:
      - name: Check out Fitz Destroyer
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish harness image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.destroyer
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cntryl/fitz-destroyer:${{ github.sha }}
          cache-from: type=gha,scope=destroyer-harness
          cache-to: type=gha,mode=max,scope=destroyer-harness

  scenarios:
    name: scenarios (${{ matrix.scenario }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - clean-restart
          - cache-loss
          - durability-crash-cuts
          - queue-overload-recovery
          - response-loss
          - active-graceful-shutdown
          - half-open-session
          - authorization-isolation
          - stream-global-recovery
          - queue-dead-letter-fencing
          - cold-boot-provider-outage
          - hostile-rpc-worker
          - upgrade-recovery
          - cross-transport-recovery
          - outbound-blackhole
          - broker-pause
          - route-cardinality-churn
          - cache-and-disk-exhaustion
          - queue-redelivery
          - lease-contention
          - hot-route-canary
          - protocol-abuse
          - notice-fanout
          - schedule-delivery
          - session-boundaries
          - rpc-pressure
          - rpc-stream-hose
          - connection-storm
          - domain-pressure
          - chaos
          - soak
          - storage-faults
          - queue-lifecycle
          - schedule-outage
          - transaction-contention
          - stream-replay
          - live-churn
          - lease-route-aliasing
          - tcp-preauth-framing-slowloris
          - connect-pipeline-family-rebind
          - ephemeral-reply-loss-cleanup
          - saturated-slow-recipient-isolation
          - shutdown-reconnect-cleanup-storm
          - control-lane-cleanup-under-saturation
          - route-family-isolation-matrix
          - rpc-response-state-conformance
    steps:
      - name: Check out Fitz Destroyer
        uses: actions/checkout@v7
        with:
          path: fitz-destroyer
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fitz-destroyer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: fitz-destroyer

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run smoke scenario
        env:
          DESTROYER_IMAGE: ${{ needs.build.outputs.image }}
          FITZ_IMAGE: ghcr.io/cntryl/fitz:latest
        run: >-
          npm run destroy -- "${{ matrix.scenario }}" --scale smoke
          --duration-ms 480000
        working-directory: fitz-destroyer

      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: fitz-destroyer/artifacts/
          if-no-files-found: warn
          retention-days: 14

  analysis:
    name: analysis
    if: always()
    needs: scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out Fitz Destroyer
        uses: actions/checkout@v7
        with:
          path: fitz-destroyer
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fitz-destroyer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: fitz-destroyer

      - name: Run repository checks
        id: checks
        continue-on-error: true
        run: npm run check
        working-directory: fitz-destroyer

      - name: Download scenario evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: scenario-*-${{ github.run_attempt }}
          path: scenario-artifacts
          merge-multiple: true

      - name: Build final report and enforce verdict
        env:
          ANALYSIS_RESULT: ${{ steps.checks.outcome }}
          MATRIX_RESULT: ${{ needs.scenarios.result }}
        run: >-
          npm run report --
          --artifacts-dir "${{ github.workspace }}/scenario-artifacts"
          --output-dir "${{ github.workspace }}/destroyer-report"
          --analysis-result "$ANALYSIS_RESULT"
          --matrix-result "$MATRIX_RESULT"
        working-directory: fitz-destroyer

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fitz-destroyer-report-${{ github.run_attempt }}
          path: destroyer-report/
          if-no-files-found: error
          retention-days: 30

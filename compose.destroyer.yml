# Published-image Fitz recovery harness. The host runner owns lifecycle and cleanup.
services:
  sqrzl:
    image: "${SQRZL_IMAGE:-ghcr.io/sqrzl/sqrzl-emulator:latest}"
    restart: "no"
    environment:
      SQRZL_BLOBS_PATH: /app/blobs
      SQRZL_ACCESS_KEY_ID: admin
      SQRZL_SECRET_ACCESS_KEY: sqrzl-secret
      SQRZL_BUCKET_LIST: fitz-destroyer
    volumes:
      - sqrzl-blobs:/app/blobs

  storage-proxy:
    image: "${DESTROYER_IMAGE:?DESTROYER_IMAGE must identify the published harness image}"
    command:
      - storage-proxy.mjs
    restart: "no"
    depends_on:
      - sqrzl
    environment:
      STORAGE_PROXY_UPSTREAM_HOST: sqrzl
      STORAGE_PROXY_UPSTREAM_PORT: "9000"
      STORAGE_PROXY_DATA_PORT: "9000"
      STORAGE_PROXY_CONTROL_PORT: "9100"
    ports:
      - "127.0.0.1::9100"

  fitz:
    cpus: "${FITZ_CPU_LIMIT:-0}"
    image: "${FITZ_IMAGE:-ghcr.io/cntryl/fitz:latest}"
    restart: "no"
    stop_grace_period: 15s
    healthcheck:
      disable: true
    depends_on:
      - storage-proxy
    ports:
      - "127.0.0.1:${FITZ_HOST_HTTP_PORT:-4390}:4090"
      - "127.0.0.1::9090"
    environment:
      FITZ_AUTH_REQUIRED: "${FITZ_AUTH_REQUIRED:-false}"
      FITZ_ASSUME_EXTERNAL_TLS: "${FITZ_ASSUME_EXTERNAL_TLS:-false}"
      FITZ_JWT_HMAC_SECRET: "${FITZ_JWT_HMAC_SECRET:-fitz-destroyer-local-auth-only}"
      FITZ_JWT_AUDIENCES: "${FITZ_JWT_AUDIENCES:-fitz,fitz-broker}"
      FITZ_ROUTE_FAMILIES: "${FITZ_ROUTE_FAMILIES:-1}"
      FITZ_ROUTE_FAMILY_MAP: "${FITZ_ROUTE_FAMILY_MAP:-}"
      FITZ_ROUTE_FAMILY_CLAIM: "${FITZ_ROUTE_FAMILY_CLAIM:-tid}"
      FITZ_ADMIN_AUTH_MODE: open
      FITZ_HTTP_PORT: "4090"
      FITZ_METRICS_BIND_ADDR: 0.0.0.0
      FITZ_METRICS_PORT: "9090"
      FITZ_DRAIN_GRACE_SECONDS: "1"
      FITZ_DESTROYER_FAILPOINTS: "${FITZ_DESTROYER_FAILPOINTS:-disabled}"
      FITZ_STORAGE_MODE: cloud
      FITZ_STORAGE_PROVIDER: sqrzl-s3
      FITZ_STORAGE_ENDPOINT: http://storage-proxy:9000
      FITZ_STORAGE_BUCKET: fitz-destroyer
      FITZ_STORAGE_PREFIX: "${FITZ_STORAGE_PREFIX:-destroyer}"
      FITZ_STORAGE_CACHE_PATH: /data/fitz-cloud-cache
      FITZ_STORAGE_CLOUD_DURABILITY: strict
      FITZ_QUEUE_WRITE_POLICY: strict
      FITZ_LOG_FORMAT: json
      FITZ_LOG_LEVEL: info
      OTEL_ENABLED: "false"
    volumes:
      - fitz-cache:/data

  client-proxy:
    image: "${DESTROYER_IMAGE:?DESTROYER_IMAGE must identify the published harness image}"
    command:
      - storage-proxy.mjs
    restart: "no"
    depends_on:
      - fitz
    environment:
      FAULT_PROXY_NAME: client-proxy
      FAULT_PROXY_UPSTREAM_HOST: fitz
      FAULT_PROXY_UPSTREAM_PORT: "4090"
      FAULT_PROXY_DATA_PORT: "4090"
      FAULT_PROXY_CONTROL_PORT: "9101"
    ports:
      - "127.0.0.1::9101"

  client:
    image: "${DESTROYER_IMAGE:?DESTROYER_IMAGE must identify the published harness image}"
    profiles:
      - clients
    restart: "no"
    depends_on:
      - fitz
    environment:
      FITZ_URL: ws://fitz:4090/ws
      DESTROYER_MODE: bombard
      DESTROYER_NAMESPACE: "${DESTROYER_NAMESPACE:-destroyer}"
      DESTROYER_SEED: "${DESTROYER_SEED:-424242}"
      DESTROYER_DOMAINS: "${DESTROYER_DOMAINS:-}"
      DESTROYER_REQUEST_TIMEOUT_MS: "${DESTROYER_REQUEST_TIMEOUT_MS:-10000}"
      DESTROYER_PROGRESS_INTERVAL_MS: "${DESTROYER_PROGRESS_INTERVAL_MS:-1000}"

  disk-filler:
    image: "${DESTROYER_IMAGE:?DESTROYER_IMAGE must identify the published harness image}"
    profiles:
      - clients
    entrypoint:
      - /nodejs/bin/node
    command:
      - dist/disk-filler.js
    user: "0:0"
    volumes:
      - fitz-cache:/volumes/cache
      - sqrzl-blobs:/volumes/storage

volumes:
  sqrzl-blobs:
  fitz-cache:
